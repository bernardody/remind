spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/remind
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtppro.zoho.com
    port: 465
    username: ${ZOHO_MAIL_USERNAME:}
    password: ${ZOHO_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        socketFactory:
          class: javax.net.ssl.SSLSocketFactory
          port: 465

server:
  error:
    include-message: always

jwt:
  public:
    key: classpath:authz.pub
  private:
    key: classpath:authz.pem

google:
  # OAuth 2.0 Client ID do Google usado como audiência esperada do ID token (REQ-002).
  client-id: ${GOOGLE_CLIENT_ID:}

remind:
  cors:
    # Dev: só o frontend local. Nunca usar "*" (ver PRODUCTION_AUDIT.md).
    allowed-origins: http://localhost:3000
  mail:
    # Nome de exibição do remetente; o endereço vem de spring.mail.username (contato@remindapp.com.br).
    from-name: ReMind
  invite:
    # Base do link de convite enviado por e-mail (docs/specs/002-convite-questionario/PRD.md §6/§16).
    base-url: ${REMIND_INVITE_BASE_URL:http://localhost:3000}
    expiration-days: 7