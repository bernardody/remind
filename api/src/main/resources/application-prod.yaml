spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/remind}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtppro.zoho.com
    port: 465
    username: ${ZOHO_MAIL_USERNAME}
    password: ${ZOHO_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        socketFactory:
          class: javax.net.ssl.SSLSocketFactory
          port: 465

google:
  # OAuth 2.0 Client ID do Google (audiência esperada do ID token) — definido por ambiente.
  client-id: ${GOOGLE_CLIENT_ID}

# A chave que assina os JWTs da aplicação NUNCA deve vir do classpath em
# produção (ver PRODUCTION_AUDIT.md B-SEC-1 — a antiga vazou publicamente
# comitada no repo). `docker-entrypoint.sh` escreve o par real, recebido via
# env var (JWT_PRIVATE_KEY_B64/JWT_PUBLIC_KEY_B64), nesse caminho em runtime —
# sem override aqui, o Spring cairia de volta pro classpath:authz.pem do
# application.yaml, reintroduzindo a mesma falha.
jwt:
  public:
    key: file:/app/secrets/authz.pub
  private:
    key: file:/app/secrets/authz.pem

remind:
  cors:
    # Nunca "*" (ver PRODUCTION_AUDIT.md B-SEC-CORS) — só o domínio real do frontend.
    # Sobrescrevível via env var pra adicionar origem extra sem precisar de novo deploy.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://remindapp.com.br,https://www.remindapp.com.br}
  mail:
    from-name: ReMind
  invite:
    base-url: https://remindapp.com.br
    expiration-days: 7

server:
  error:
    include-message: never  # Não expor stack traces em produção
