spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/remind}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

google:
  # OAuth 2.0 Client ID do Google (audiência esperada do ID token) — definido por ambiente.
  client-id: ${GOOGLE_CLIENT_ID}

server:
  error:
    include-message: never  # Não expor stack traces em produção
