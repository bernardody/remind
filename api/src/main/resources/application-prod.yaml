spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/remind}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtppro.zoho.com
    port: 465
    username: ${ZOHO_MAIL_USERNAME}
    password: ${ZOHO_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        socketFactory:
          class: javax.net.ssl.SSLSocketFactory
          port: 465

google:
  # OAuth 2.0 Client ID do Google (audiência esperada do ID token) — definido por ambiente.
  client-id: ${GOOGLE_CLIENT_ID}

remind:
  mail:
    from-name: ReMind
  invite:
    base-url: https://remindapp.com.br
    expiration-days: 7

server:
  error:
    include-message: never  # Não expor stack traces em produção
