spring:
  datasource:
    # NON_KEYWORDS=VALUE: "value" (coluna de question_options) é palavra reservada no H2.
    url: jdbc:h2:mem:remind;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  mail:
    # Só o suficiente para o bean JavaMailSender existir no contexto de teste — nenhum
    # teste de contexto completo dispara envio real (ver MailServiceManualTest, isolado).
    host: localhost
    username: test@example.com

jwt:
  public:
    key: classpath:authz.pub
  private:
    key: classpath:authz.pem

google:
  client-id: test-google-client-id

remind:
  mail:
    from-name: ReMind
  invite:
    base-url: http://localhost:3000

server:
  error:
    include-message: always
